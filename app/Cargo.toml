[package]
name = "calculatrice-chantier"
description = "Calculatrice de chantier — interface graphique"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
noyau = { package = "calculatrice-noyau", path = "../noyau" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

# Version de bureau : fenêtre native et boîte « Enregistrer sous » du système.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
rfd = "0.18.0"

# Version Web : rendu WebGL, sans les polices intégrées d'egui (les polices
# libres du dossier `polices/` les remplacent), et accès au navigateur.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.103", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Node",
    "Storage",
    "Url",
    "Window",
] }
