<!DOCTYPE html>
<html lang="fr-CA">
<!--
    Page hôte de la version Web de la calculatrice (construite avec trunk).
    Elle ne contient que le canevas où le programme se dessine, un écran
    d'attente et un message d'échec. Les identifiants `calculatrice`,
    `chargement` et `echec` sont ceux qu'attend `app/src/plateforme/web.rs`.

    La page est écrite en français; l'attribut `data-en` d'un élément porte son
    texte anglais, que le premier script met en place quand la calculatrice est
    en anglais (cahier des charges, section 24).
-->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#002050">

    <!-- Application installable sur téléphone, tablette et ordinateur. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icones/icone-apple-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Constructo AI">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description"
        content="Calculatrice de construction gratuite, en français et en anglais : pieds-pouces-fractions et métrique, charpente, escaliers, béton, plomberie, électricité, finition. Installable et utilisable hors ligne. Free construction calculator, in English and French: feet-inches-fractions and metric, framing, stairs, concrete, plumbing, electrical, finishing.">
    <meta name="author" content="Sylvain Leduc, Constructo AI">
    <title>Constructo AI</title>

    <!-- Le programme, compilé en WebAssembly. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="calculatrice-chantier" data-wasm-opt="0">

    <!-- Fichiers copiés tels quels dans le site : manifeste, service hors ligne, icônes. -->
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="sw.js">
    <link data-trunk rel="copy-file" href="manuel.html">
    <link data-trunk rel="copy-file" href="manual.html">
    <link data-trunk rel="copy-dir" href="icones">

    <!-- Icône : le logo de Constructo AI. -->
    <link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">

    <style>
        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Pas de rebond ni de « tirer pour actualiser » sous le doigt. */
            overscroll-behavior: none;
            background: #002050;
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            /* Les gestes sont ceux de la calculatrice : ni zoom, ni sélection, ni menu d'appui long. */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(#002B6B, #001833);
        }

        .message[hidden] {
            display: none;
        }

        .message img {
            width: 84px;
            height: 84px;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
        }

        .message h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .message p {
            margin: 0;
            max-width: 30em;
            font-size: 15px;
            line-height: 1.5;
            color: #cfe2fc;
        }

        .message p.gracieusete {
            font-size: 13px;
            color: #9db9e8;
        }

        .barre {
            width: 160px;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.16);
        }

        .barre::before {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: #F97316;
            animation: va-et-vient 1.1s ease-in-out infinite alternate;
        }

        @keyframes va-et-vient {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(150%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .barre::before {
                animation: none;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="calculatrice"></canvas>

    <!-- Écran d'attente : retiré par le programme dès qu'il est prêt. -->
    <div id="chargement" class="message">
        <img src="icones/icone-192.png" width="84" height="84" alt="">
        <h1 data-en="Constructo AI">Constructo AI</h1>
        <div class="barre" role="progressbar" aria-label="Chargement" data-en-aria-label="Loading"></div>
        <p class="gracieusete" data-en="Courtesy of Sylvain Leduc of Constructo AI">Gracieuseté de Sylvain Leduc
            de Constructo AI</p>
        <noscript>
            <p>Cette calculatrice a besoin de JavaScript. Activez-le dans les réglages de votre navigateur, puis
                rechargez la page.</p>
            <p lang="en">This calculator needs JavaScript. Turn it on in your browser's settings, then reload the
                page.</p>
        </noscript>
    </div>

    <!-- Message d'échec : montré si le programme ne peut pas démarrer. -->
    <div id="echec" class="message" hidden>
        <h1 data-en="The calculator could not start">La calculatrice n'a pas pu démarrer</h1>
        <p
            data-en="Reload the page. If the problem persists, update your browser or try another one: the calculator needs WebAssembly and WebGL (a recent Chrome, Edge, Firefox or Safari).">
            Rechargez la page. Si le problème persiste, mettez votre navigateur à jour ou essayez-en un autre : la
            calculatrice a besoin de WebAssembly et de WebGL (Chrome, Edge, Firefox ou Safari récents).</p>
    </div>

    <script>
        // Langue de l'écran d'attente et du message d'échec : celle que l'utilisateur a
        // choisie dans la calculatrice; à la première visite, celle du navigateur si
        // c'est le français ou l'anglais (la même règle que le programme, section 24).
        (function () {
            function langue() {
                try {
                    var etat = JSON.parse(localStorage.getItem("CalculatriceChantier/etat.json") || "null");
                    if (etat) {
                        // Un état sans langue vient d'une version où tout était en français.
                        return etat.preferences && etat.preferences.langue === "Anglais" ? "en" : "fr";
                    }
                } catch (erreur) { }
                var preferees = navigator.languages && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language || ""];
                for (var i = 0; i < preferees.length; i++) {
                    var code = String(preferees[i]).slice(0, 2).toLowerCase();
                    if (code === "fr" || code === "en") {
                        return code;
                    }
                }
                return "fr";
            }
            if (langue() !== "en") {
                return;
            }
            document.documentElement.lang = "en-CA";
            document.title = "Constructo AI";
            var elements = document.querySelectorAll("[data-en]");
            for (var i = 0; i < elements.length; i++) {
                elements[i].textContent = elements[i].getAttribute("data-en");
            }
            var barre = document.querySelector("[data-en-aria-label]");
            if (barre) {
                barre.setAttribute("aria-label", barre.getAttribute("data-en-aria-label"));
            }
        })();

        // Si le programme ne peut même pas se charger (navigateur trop ancien, réseau coupé),
        // montrer le message d'échec plutôt qu'une attente sans fin. Une fois l'écran
        // d'attente retiré par le programme, ce code ne fait plus rien.
        (function () {
            function echecDuChargement() {
                var chargement = document.getElementById("chargement");
                var echec = document.getElementById("echec");
                if (chargement && echec) {
                    chargement.remove();
                    echec.hidden = false;
                }
            }
            window.addEventListener("error", echecDuChargement, true);
            window.addEventListener("unhandledrejection", echecDuChargement);
        })();

        // Hors ligne : le service garde une copie du site dans l'appareil.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () { });
            });
        }

        // Installation : Chrome et Edge annoncent quand ils peuvent installer
        // l'application. On garde l'invitation pour le bouton « Installer » du menu
        // (voir `app/src/plateforme/web.rs`).
        window.addEventListener("beforeinstallprompt", function (invitation) {
            invitation.preventDefault();
            window.invitationInstallation = invitation;
        });
        window.addEventListener("appinstalled", function () {
            window.invitationInstallation = null;
        });
    </script>
</body>

</html>
